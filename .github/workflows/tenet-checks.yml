name: Tenet checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontmatter:
    name: Frontmatter validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run frontmatter check
        run: python3 tools/scripts/check_front_matter.py

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan diff for secrets (PR)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x tools/scripts/secret_scan_diff.sh
          tools/scripts/secret_scan_diff.sh origin/${{ github.base_ref }} HEAD
      - name: Scan diff for secrets (push)
        if: github.event_name == 'push'
        run: |
          chmod +x tools/scripts/secret_scan_diff.sh
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push — skipping diff scan"
          else
            tools/scripts/secret_scan_diff.sh "$BEFORE" HEAD
          fi

  repo-health:
    name: Repo health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repo health check
        run: python3 tools/scripts/check_repo_health.py
      - name: Validate team roster and operational lanes
        run: python3 bin/tenet-lane check

  doctrine-integrity:
    name: Doctrine integrity (anti-poisoning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify session-start doctrine matches its checksum manifest
        run: python3 tools/scripts/verify_doctrine_integrity.py

  security-tests:
    name: Security control tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install --upgrade pytest
      - name: Run offline security-control test suite
        run: python3 -m pytest tests/ -q

  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install a fresh workspace from this commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git switch -C ci-install
          TENET_REPO="file://$GITHUB_WORKSPACE" TENET_REF=ci-install sh install.sh "$RUNNER_TEMP/ws"
      - name: Workspace is independent, clean, and wired
        working-directory: ${{ runner.temp }}/ws
        run: |
          test -z "$(git remote)"                          || { echo "remote still set"; exit 1; }
          test -z "$(git status --porcelain)"              || { git status; exit 1; }
          test "$(git config core.hooksPath)" = .githooks  || { echo "hook not installed"; exit 1; }
          grep -q "OBSERVE" memory/session-context.md      || { echo "context missing"; exit 1; }
      - name: Re-running bootstrap leaves the tree clean
        working-directory: ${{ runner.temp }}/ws
        run: |
          ./bootstrap.sh
          test -z "$(git status --porcelain)" || { git status; git diff | head -40; exit 1; }
      - name: Installer refuses a non-empty directory
        run: |
          mkdir -p "$RUNNER_TEMP/full" && echo keep > "$RUNNER_TEMP/full/mine.txt"
          if TENET_REPO="file://$GITHUB_WORKSPACE" sh install.sh "$RUNNER_TEMP/full"; then exit 1; fi
          test "$(ls -A "$RUNNER_TEMP/full")" = mine.txt
